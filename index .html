<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recicla Fácil ♻️</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #176d91;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #2e7d32;
        }

        .contenedor {
            background-color: white;
            max-width: 500px;
            margin: auto;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        #residuo {
            font-size: 70px;
            margin: 20px;
        }

        button {
            border: none;
            padding: 15px;
            margin: 8px;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            transform: scale(1.05);
        }

        .papel {
            background-color: #d7ccc8;
        }

        .plastico {
            background-color: #90caf9;
        }

        .vidrio {
            background-color: #a5d6a7;
        }

        .metal {
            background-color: #bdbdbd;
        }

        .basura {
            background-color: #eeeeee;
        }

        .electronicos {
            background-color: #ce93d8;
        }

        #resultado {
            font-size: 20px;
            font-weight: bold;
            margin: 20px;
        }

        #siguiente {
            background-color: #43a047;
            color: white;
            display: none;
        }

        #premio {
            font-size: 25px;
            color: #e91e63;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <h1>♻️ Recicla Fácil</h1>

        <p>¿En qué contenedor colocarías este residuo?</p>

        <div id="residuo">🥤</div>

        <h2 id="nombreResiduo">Botella de plástico</h2>

        <div>

            <button class="papel" onclick="responder('papel')">
                📄 Papel / Cartón
            </button>

            <button class="plastico" onclick="responder('plastico')">
                🧴 Plástico
            </button>

            <button class="vidrio" onclick="responder('vidrio')">
                🍾 Vidrio
            </button>

            <button class="metal" onclick="responder('metal')">
                🥫 Metal
            </button>

            <button class="basura" onclick="responder('basura')">
                🗑️ No reciclable
            </button>

            <button class="electronicos" onclick="responder('electronicos')">
                💻 Residuos electrónicos
            </button>

        </div>

        <p id="resultado"></p>

        <h3>
            Puntuación: <span id="puntos">0</span>
        </h3>

        <button id="siguiente" onclick="siguientePregunta()">
            ➡️ Siguiente
        </button>

        <p id="premio"></p>

    </div>

<script>

    const preguntas = [

        {
            emoji: "🥤",
            nombre: "Botella de plástico",
            respuesta: "plastico"
        },

        {
            emoji: "📰",
            nombre: "Periódico",
            respuesta: "papel"
        },

        {
            emoji: "🍾",
            nombre: "Botella de vidrio",
            respuesta: "vidrio"
        },

        {
            emoji: "🥫",
            nombre: "Lata",
            respuesta: "metal"
        },

        {
            emoji: "🧻",
            nombre: "Papel muy sucio",
            respuesta: "basura"
        },

        {
            emoji: "📦",
            nombre: "Caja de cartón",
            respuesta: "papel"
        },

        {
            emoji: "🧴",
            nombre: "Envase de plástico",
            respuesta: "plastico"
        },

        {
            emoji: "🎮",
            nombre: "Control de videojuegos",
            respuesta: "electronicos"
        },

        {
            emoji: "🍷",
            nombre: "Frasco de vidrio",
            respuesta: "vidrio"
        },

        {
            emoji: "🛍️",
            nombre: "Bolsa de plástico",
            respuesta: "plastico"
        },

        {
            emoji: "🖥️",
            nombre: "Computadora",
            respuesta: "electronicos"
        },

        {
            emoji: "🗺️",
            nombre: "Mapa",
            respuesta: "papel"
        },

        {
            emoji: "🥄",
            nombre: "Lata de metal",
            respuesta: "metal"
        },

        {
            emoji: "🎉",
            nombre: "Confeti de papel",
            respuesta: "papel"
        },

        {
            emoji: "🥛",
            nombre: "Vaso de vidrio",
            respuesta: "vidrio"
        }

    ];

    let preguntaActual = 0;
    let puntos = 0;
    let respondido = false;

    function cargarPregunta() {

        document.getElementById("residuo").textContent =
            preguntas[preguntaActual].emoji;

        document.getElementById("nombreResiduo").textContent =
            preguntas[preguntaActual].nombre;

        document.getElementById("resultado").textContent = "";

        document.getElementById("siguiente").style.display = "none";

        respondido = false;
    }

    function responder(respuesta) {

        if (respondido) {
            return;
        }

        respondido = true;

        if (respuesta === preguntas[preguntaActual].respuesta) {

            puntos++;

            document.getElementById("resultado").textContent =
                " ¡Correcto! Muy bien.";

            document.getElementById("puntos").textContent = puntos;

        } else {

            document.getElementById("resultado").textContent =
                "😭 Incorrecto. ¡Inténtalo en la siguiente pregunta!";

        }

        document.getElementById("siguiente").style.display =
            "inline-block";
    }

    function siguientePregunta() {

        preguntaActual++;

        if (preguntaActual < preguntas.length) {

            cargarPregunta();

        } else {

            document.getElementById("residuo").textContent = "🌎";

            document.getElementById("nombreResiduo").textContent =
                "¡Juego terminado!";

            document.getElementById("resultado").innerHTML =
                "🎉 Obtuviste " + puntos + " de " +
                preguntas.length + " puntos.";

            document.getElementById("siguiente").style.display =
                "none";

            document.getElementById("premio").innerHTML =
                "🍬 ¡Felicidades! ¡Ganaste un dulce! 🍬";
        }
    }

    cargarPregunta();

</script>

</body>
</html>
